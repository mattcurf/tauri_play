name: build desktop artifacts

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  tauri:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            bundles: app,dmg
            artifact-name: macos-artifacts
            artifact-path: |
              src-tauri/target/release/bundle/README.txt
              src-tauri/target/release/bundle/macos/
              src-tauri/target/release/bundle/dmg/
          - platform: windows-latest
            bundles: nsis,msi
            artifact-name: windows-artifacts
            artifact-path: |
              src-tauri/target/release/bundle/nsis/
              src-tauri/target/release/bundle/msi/

    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - name: Install frontend dependencies
        run: npm ci

      - name: Build Tauri bundles
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          args: --bundles ${{ matrix.bundles }}

      - name: Add macOS artifact README
        if: runner.os == 'macOS'
        shell: bash
        run: |
          cat > src-tauri/target/release/bundle/README.txt <<'EOF'
          Tauri Tank Demo - macOS artifact

          This app is ad-hoc signed for local testing, but it is not Apple notarized.
          macOS may still report that it is "damaged" or cannot be opened after download.

          If you trust this CI artifact, clear quarantine for just this app:

            APP="$HOME/Downloads/Tauri Tank Demo.app"
            xattr -dr com.apple.quarantine "$APP"
            open "$APP"

          If the app came from a GitHub Actions artifact ZIP and still will not open,
          repair executable permissions and refresh the ad-hoc signature first:

            APP="$HOME/Downloads/Tauri Tank Demo.app"
            chmod +x "$APP/Contents/MacOS/tauri-tank-demo"
            codesign --force --deep --sign - "$APP"
            xattr -dr com.apple.quarantine "$APP"
            open "$APP"

          Avoid `sudo spctl --master-disable`; it disables Gatekeeper globally.
          EOF

      - name: Upload desktop artifacts
        uses: actions/upload-artifact@v5
        with:
          name: ${{ matrix.artifact-name }}
          path: ${{ matrix.artifact-path }}
          if-no-files-found: error
